#  ← extensions + grants (runs once)# ─────────────────────────────────────────────────────────────
#  PostgreSQL tuning — 512 MB RAM budget (4 GB VPS)
#  Generated for n8n workload: many small transactional queries
# ─────────────────────────────────────────────────────────────

# Memory
shared_buffers            = 128MB     # 25% of 512 MB container budget
effective_cache_size      = 384MB     # ~75% of container budget
work_mem                  = 8MB       # per-sort / per-hash; n8n queries are light
maintenance_work_mem      = 64MB      # for VACUUM, CREATE INDEX

# WAL / Checkpoints
wal_buffers               = 8MB
checkpoint_completion_target = 0.9
min_wal_size              = 80MB
max_wal_size              = 1GB

# Connections
max_connections           = 50        # n8n main + 5 workers; keep headroom

# Planner
random_page_cost          = 1.1       # SSD-friendly
effective_io_concurrency  = 200       # SSD

# Logging (lightweight)
log_min_duration_statement = 1000     # log queries > 1 s
log_checkpoints            = on
log_connections            = off
log_disconnections         = off
log_lock_waits             = on

# Autovacuum — more aggressive for high-churn executions table
autovacuum_vacuum_scale_factor   = 0.05
autovacuum_analyze_scale_factor  = 0.025
autovacuum_vacuum_cost_delay     = 2ms