# ← 256 MB LRU cap, password, 
# ─────────────────────────────────────────────────────────────
#  redis.conf — n8n Queue  |  256 MB cap  |  Redis 7
# ─────────────────────────────────────────────────────────────

# ── Network ───────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ── Auth — password is set at container runtime ───────────────
#  Injected via docker-compose environment; leave placeholder here.
#  The compose `command:` override will pass --requirepass if needed,
#  but since we bake the conf we use an env-substituted value.
#  ⚠  Change this default before deploying!
requirepass changeme_redis_password

# ── Memory ───────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru   # evict LRU keys when full (queue is ephemeral)
maxmemory-samples 5

# ── Persistence — light RDB snapshot, no AOF overhead ────────
save 900 1
save 300 10
save 60  1000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Disable AOF (queue data is not critical — n8n will re-queue on restart)
appendonly no

# ── Performance ──────────────────────────────────────────────
hz 15
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ── Logging ──────────────────────────────────────────────────
loglevel warning
logfile ""

# ── Slow log ─────────────────────────────────────────────────
slowlog-log-slower-than 10000   # microseconds
slowlog-max-len 128

# ── Clients ──────────────────────────────────────────────────
maxclients 100